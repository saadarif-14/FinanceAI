# Bind to all interfaces so Docker containers can reach it
bind 0.0.0.0

# Default port
port 6379

# No password for local dev — add requirepass <secret> for production
# requirepass yourpassword

# Persistence: save a snapshot every 60s if at least 1 key changed
save 60 1
save 300 10
save 900 1000

# Where to store the dump
dir /data
dbfilename dump.rdb

# Max memory — prevents Redis eating all RAM on a dev machine
maxmemory 128mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
